<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNPSC Master Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .glass { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); }
        
        /* Desktop 2-column grid */
        .test-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(500px, 1fr)); gap: 1.25rem; }
        .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 1rem; }
        
        /* Mobile fallback */
        @media (max-width: 1024px) { 
            .test-grid, .notes-grid { grid-template-columns: 1fr; } 
        }

        /* Hide radio appearance but keep functionality */
        input[type="radio"] { width: 1.1rem; height: 1.1rem; accent-color: #4f46e5; }
    </style>
</head>
<body class="min-h-screen">

    <nav class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fas fa-landmark text-indigo-400"></i>
                <h1 class="text-sm font-black tracking-widest uppercase italic">TNPSC <span class="text-indigo-400">Master</span></h1>
            </div>
            <div id="status" class="text-[9px] bg-slate-800 border border-slate-700 px-3 py-1 rounded-full text-slate-400 font-bold tracking-widest">READY</div>
        </div>
    </nav>

    <main class="container mx-auto p-4 md:p-6 max-w-6xl">
        <div class="glass rounded-[2rem] shadow-sm p-5 md:p-8 mb-6 border border-slate-200">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Standard</label>
                    <select id="stdSelect" onchange="updateSubjects()" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-[13px] font-semibold outline-none focus:border-indigo-500 transition-all"></select>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Subject</label>
                    <select id="subjectSelect" onchange="updateUnits()" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-[13px] font-semibold outline-none">
                        <option>-- Select Std --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Unit / Lesson</label>
                    <select id="unitSelect" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-[13px] font-semibold outline-none">
                        <option>-- Select Sub --</option>
                    </select>
                </div>
            </div>

            <div class="flex flex-col md:flex-row gap-3 mt-6">
                <button onclick="loadAction('notes')" class="flex-1 bg-white border border-emerald-500 text-emerald-600 py-3 rounded-xl font-bold text-[12px] hover:bg-emerald-50 transition-all uppercase tracking-widest">
                    <i class="fas fa-sticky-note mr-2"></i> View Notes
                </button>
                <button onclick="openConfig()" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold text-[12px] hover:bg-indigo-700 shadow-lg shadow-indigo-100 transition-all uppercase tracking-widest">
                    <i class="fas fa-bolt mr-2"></i> Start Mock Test
                </button>
            </div>
        </div>

        <div id="displayArea"></div>
    </main>

    <div id="configModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-[60] items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl scale-95 transition-transform">
            <h3 class="text-lg font-black mb-1">Set Test Limit</h3>
            <p class="text-slate-500 text-[11px] mb-6">Enter number of questions to display:</p>
            <input type="number" id="qLimit" value="25" class="w-full p-3 bg-slate-100 rounded-xl text-center text-xl font-black text-indigo-600 outline-none border-2 border-transparent focus:border-indigo-500 mb-6">
            <div class="flex gap-2">
                <button onclick="loadAction('test')" class="flex-[2] bg-indigo-600 text-white py-3 rounded-xl font-bold text-xs uppercase tracking-widest">Start Now</button>
                <button onclick="closeConfig()" class="flex-1 bg-slate-100 text-slate-500 py-3 rounded-xl font-bold text-xs uppercase tracking-widest">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_USER = 'as-imgn2kion';
        const REPO_NAME = 'TNPSC';
        const BASE_PATH = 'CSV_FILES';

        let masterData = [];
        let sessionQuestions = [];
        let userAnswers = [];

        const shuffle = (arr) => arr.sort(() => Math.random() - 0.5);

        async function fetchGH(path) {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${path}`);
            return await res.json();
        }

        async function initDashboard() {
            const folders = await fetchGH(BASE_PATH);
            const stdSelect = document.getElementById('stdSelect');
            stdSelect.innerHTML = '<option value="">-- Standard --</option>';
            folders.forEach(f => { if(f.type === 'dir') stdSelect.innerHTML += `<option value="${f.name}">${f.name}</option>`; });
        }

        async function updateSubjects() {
            const std = document.getElementById('stdSelect').value;
            const folders = await fetchGH(`${BASE_PATH}/${std}`);
            const subSelect = document.getElementById('subjectSelect');
            subSelect.innerHTML = '<option value="">-- Subject --</option>';
            folders.forEach(f => { if(f.type === 'dir') subSelect.innerHTML += `<option value="${f.name}">${f.name}</option>`; });
        }

        async function updateUnits() {
            const std = document.getElementById('stdSelect').value;
            const sub = document.getElementById('subjectSelect').value;
            const files = await fetchGH(`${BASE_PATH}/${std}/${sub}`);
            const unitSelect = document.getElementById('unitSelect');
            unitSelect.innerHTML = '<option value="">-- Unit --</option>';
            files.forEach(f => { if(f.name.endsWith('.csv')) unitSelect.innerHTML += `<option value="${f.name}">${f.name.replace('.csv','')}</option>`; });
        }

        function openConfig() { document.getElementById('configModal').classList.replace('hidden', 'flex'); }
        function closeConfig() { document.getElementById('configModal').classList.replace('flex', 'hidden'); }

        async function loadAction(mode) {
            const std = document.getElementById('stdSelect').value;
            const sub = document.getElementById('subjectSelect').value;
            const file = document.getElementById('unitSelect').value;
            if(!file) return alert("Please select a unit!");

            closeConfig();
            const url = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/main/${BASE_PATH}/${std}/${sub}/${encodeURIComponent(file)}`;
            
            try {
                const res = await fetch(url);
                const text = await res.text();
                const lines = text.trim().split('\n');
                
                masterData = lines.slice(1).map(line => {
                    const row = line.match(/(".*?"|[^",\n\r]+)(?=\s*,|\s*$)/g) || [];
                    return row.map(cell => cell.replace(/"/g, '').trim());
                }).filter(r => r.length >= 6);

                mode === 'notes' ? renderNotes() : startTest();
            } catch (e) { alert("Error loading data. Check GitHub path."); }
        }

        // NEW COMPACT NOTES VIEW
        function renderNotes() {
            const area = document.getElementById('displayArea');
            let html = `<div class="mb-4 flex items-center justify-between px-2"><h2 class="text-xs font-black uppercase tracking-widest text-slate-400">Quick Study Mode</h2></div>
                        <div class="notes-grid">`;
            masterData.forEach((q, i) => {
                html += `
                <div class="bg-white p-4 rounded-xl border border-slate-200 flex flex-col justify-center">
                    <p class="text-[12px] font-medium text-slate-500 mb-1">Question ${i+1}</p>
                    <p class="text-[13px] font-bold text-slate-800 leading-snug mb-3">${q[0]}</p>
                    <div class="bg-emerald-50 text-emerald-700 p-2 px-3 rounded-lg text-[12px] font-black inline-flex items-center">
                        <i class="fas fa-check-circle mr-2 opacity-50"></i> ${q[5]}
                    </div>
                </div>`;
            });
            html += `</div>`;
            area.innerHTML = html;
        }

        function startTest() {
            const limit = parseInt(document.getElementById('qLimit').value) || masterData.length;
            sessionQuestions = shuffle([...masterData]).slice(0, limit).map(q => {
                let options = shuffle([ {txt: q[1]}, {txt: q[2]}, {txt: q[3]}, {txt: q[4]} ]);
                return { question: q[0], options: options, correct: q[5] };
            });

            userAnswers = new Array(sessionQuestions.length).fill(null);
            const area = document.getElementById('displayArea');
            let html = `<div class="test-grid">`;
            
            sessionQuestions.forEach((q, qIdx) => {
                html += `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 flex flex-col shadow-sm">
                    <p class="text-[11px] font-black text-indigo-500 uppercase mb-2">Q${qIdx+1}</p>
                    <p class="font-bold text-[14px] leading-relaxed mb-4 text-slate-800">${q.question}</p>
                    <div class="space-y-2 mt-auto">
                        ${q.options.map(opt => `
                            <label class="flex items-center p-3 border border-slate-100 rounded-xl cursor-pointer hover:bg-indigo-50/50 transition-all">
                                <input type="radio" name="q${qIdx}" value="${opt.txt}" onchange="userAnswers[${qIdx}] = this.value">
                                <span class="ml-3 text-[13px] font-semibold text-slate-600">${opt.txt}</span>
                            </label>`).join('')}
                    </div>
                </div>`;
            });
            html += `</div>
            <div class="max-w-xs mx-auto mt-10 pb-20">
                <button onclick="submitTest()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black text-xs uppercase tracking-widest shadow-xl active:scale-95 transition-all">Submit Test</button>
            </div>`;
            area.innerHTML = html;
            window.scrollTo(0,0);
        }

        function submitTest() {
            let score = 0;
            sessionQuestions.forEach((q, i) => { if(userAnswers[i] === q.correct) score++; });
            const area = document.getElementById('displayArea');
            area.innerHTML = `
                <div class="bg-indigo-900 text-white p-12 rounded-[2rem] text-center mb-8">
                    <p class="text-[10px] font-black uppercase tracking-[0.4em] text-indigo-300 mb-2">Final Score</p>
                    <h2 class="text-6xl font-black mb-6">${score} / ${sessionQuestions.length}</h2>
                    <button onclick="window.location.reload()" class="bg-white text-indigo-900 px-8 py-2 rounded-lg font-black text-[10px] uppercase tracking-widest">Retake or Change Unit</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pb-20">
                    ${sessionQuestions.map((q, i) => {
                        const isCorrect = userAnswers[i] === q.correct;
                        return `
                        <div class="bg-white p-4 rounded-xl border ${isCorrect ? 'border-emerald-200 bg-emerald-50/20' : 'border-rose-200 bg-rose-50/20'}">
                            <p class="text-[12px] font-bold text-slate-800 mb-2">${i+1}. ${q.question}</p>
                            <p class="text-[11px] font-black uppercase ${isCorrect ? 'text-emerald-600' : 'text-rose-600'}">
                                ${isCorrect ? 'Correct' : 'Incorrect • Correct: ' + q.correct}
                            </p>
                        </div>`;
                    }).join('')}
                </div>
            `;
            window.scrollTo(0,0);
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
