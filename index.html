<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNPSC Master Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(12px); }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="min-h-screen">

    <nav class="bg-indigo-950 text-white p-5 shadow-xl sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-500 p-2 rounded-lg"><i class="fas fa-graduation-cap text-white"></i></div>
                <h1 class="text-xl font-black tracking-widest">TNPSC <span class="text-indigo-400">EXAM HUB</span></h1>
            </div>
            <div id="status" class="text-[10px] font-bold bg-indigo-900 px-3 py-1 rounded-full border border-indigo-800 tracking-widest">SYSTEM READY</div>
        </div>
    </nav>

    <main class="container mx-auto p-4 md:p-8 max-w-5xl">
        <div class="glass rounded-[2.5rem] card-shadow p-8 mb-10 border border-white">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-[11px] font-black text-slate-400 uppercase mb-3 ml-1">Standard</label>
                    <select id="stdSelect" onchange="updateSubjects()" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all"></select>
                </div>
                <div>
                    <label class="block text-[11px] font-black text-slate-400 uppercase mb-3 ml-1">Subject</label>
                    <select id="subjectSelect" onchange="updateUnits()" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold outline-none">
                        <option>-- Choose Std --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-black text-slate-400 uppercase mb-3 ml-1">Lesson / Unit</label>
                    <select id="unitSelect" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold outline-none">
                        <option>-- Choose Sub --</option>
                    </select>
                </div>
            </div>

            <div class="flex flex-col md:flex-row gap-4 mt-10">
                <button onclick="loadAction('notes')" class="flex-1 bg-emerald-500 text-white py-5 rounded-[1.5rem] font-black text-lg hover:bg-emerald-600 transition-transform active:scale-95 shadow-lg shadow-emerald-100 flex items-center justify-center">
                    <i class="fas fa-book-open mr-3"></i> REVISION NOTES
                </button>
                <button onclick="loadAction('test')" class="flex-1 bg-indigo-600 text-white py-5 rounded-[1.5rem] font-black text-lg hover:bg-indigo-700 transition-transform active:scale-95 shadow-lg shadow-indigo-100 flex items-center justify-center">
                    <i class="fas fa-pen-nib mr-3"></i> MOCK TEST
                </button>
            </div>
        </div>

        <div id="displayArea" class="pb-20"></div>
    </main>

    <script>
        const GITHUB_USER = 'as-imgn2kion';
        const REPO_NAME = 'TNPSC';
        const BASE_PATH = 'CSV_FILES';

        let currentQuestions = [];
        let userAnswers = [];

        async function fetchGH(path) {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${path}`);
            return await res.json();
        }

        async function initDashboard() {
            try {
                const folders = await fetchGH(BASE_PATH);
                const stdSelect = document.getElementById('stdSelect');
                stdSelect.innerHTML = '<option value="">-- Select --</option>';
                folders.forEach(f => { if(f.type === 'dir') stdSelect.innerHTML += `<option value="${f.name}">${f.name}</option>`; });
            } catch (e) { document.getElementById('status').innerText = "CONNECTION ERROR"; }
        }

        async function updateSubjects() {
            const std = document.getElementById('stdSelect').value;
            const folders = await fetchGH(`${BASE_PATH}/${std}`);
            const subSelect = document.getElementById('subjectSelect');
            subSelect.innerHTML = '<option value="">-- Select --</option>';
            folders.forEach(f => { if(f.type === 'dir') subSelect.innerHTML += `<option value="${f.name}">${f.name}</option>`; });
        }

        async function updateUnits() {
            const std = document.getElementById('stdSelect').value;
            const sub = document.getElementById('subjectSelect').value;
            const files = await fetchGH(`${BASE_PATH}/${std}/${sub}`);
            const unitSelect = document.getElementById('unitSelect');
            unitSelect.innerHTML = '<option value="">-- Select --</option>';
            files.forEach(f => { if(f.name.endsWith('.csv')) unitSelect.innerHTML += `<option value="${f.name}">${f.name.replace('.csv','')}</option>`; });
        }

        async function loadAction(mode) {
            const std = document.getElementById('stdSelect').value;
            const sub = document.getElementById('subjectSelect').value;
            const file = document.getElementById('unitSelect').value;
            if(!file) return alert("Please select a unit first!");

            const url = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/main/${BASE_PATH}/${std}/${sub}/${encodeURIComponent(file)}`;
            
            try {
                const res = await fetch(url);
                const text = await res.text();
                
                // DATA CLEANING: Skips empty lines and properly parses CSV
                const lines = text.trim().split('\n');
                currentQuestions = lines.slice(1).map(line => { // .slice(1) skips your "Question, Opt1..." header row
                    // Regex handles commas inside quotes perfectly
                    const row = line.match(/(".*?"|[^",\n\r]+)(?=\s*,|\s*$)/g) || [];
                    return row.map(cell => cell.replace(/"/g, '').trim());
                }).filter(r => r.length >= 6);

                mode === 'notes' ? renderNotes() : startTest();
            } catch (e) { alert("Could not fetch file. Ensure file is public."); }
        }

        function renderNotes() {
            const area = document.getElementById('displayArea');
            let html = `<div class="mb-8 flex items-center justify-between"><h2 class="text-3xl font-black text-slate-800">Quick Revision</h2><span class="bg-emerald-100 text-emerald-700 font-bold px-4 py-1 rounded-full text-sm">${currentQuestions.length} Topics</span></div>`;
            currentQuestions.forEach((q, i) => {
                html += `
                <div class="bg-white p-8 rounded-[2rem] card-shadow border-l-[10px] border-emerald-500 mb-6">
                    <p class="font-bold text-xl mb-6 text-slate-800">${q[0]}</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${[1,2,3,4].map(idx => `<div class="p-4 rounded-2xl border-2 ${q[5] === q[idx] ? 'bg-emerald-50 border-emerald-400 text-emerald-800 font-bold' : 'bg-slate-50 border-slate-100 text-slate-400'}">${q[idx]}</div>`).join('')}
                    </div>
                </div>`;
            });
            area.innerHTML = html;
        }

        function startTest() {
            userAnswers = new Array(currentQuestions.length).fill(null);
            const area = document.getElementById('displayArea');
            let html = `<div class="mb-8 flex items-center justify-between"><h2 class="text-3xl font-black text-slate-800">Mock Assessment</h2><span class="bg-indigo-100 text-indigo-700 font-bold px-4 py-1 rounded-full text-sm">Exam Mode</span></div>`;
            currentQuestions.forEach((q, qIdx) => {
                html += `
                <div class="bg-white p-8 rounded-[2rem] card-shadow mb-6 border border-slate-100">
                    <p class="font-black text-xl mb-8 text-slate-800 leading-snug">${qIdx+1}. ${q[0]}</p>
                    <div class="space-y-3">
                        ${[1,2,3,4].map(idx => `
                            <label class="flex items-center p-5 border-2 border-slate-50 rounded-2xl cursor-pointer hover:bg-indigo-50 hover:border-indigo-200 transition-all">
                                <input type="radio" name="q${qIdx}" value="${q[idx]}" onchange="userAnswers[${qIdx}] = this.value" class="w-5 h-5 accent-indigo-600">
                                <span class="ml-5 font-bold text-slate-600">${q[idx]}</span>
                            </label>`).join('')}
                    </div>
                </div>`;
            });
            html += `<button onclick="submitTest()" class="w-full bg-indigo-900 text-white py-6 rounded-[2rem] font-black text-2xl shadow-2xl mt-10 hover:bg-black transition-all">SUBMIT FINAL ANSWERS</button>`;
            area.innerHTML = html;
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function submitTest() {
            let score = 0;
            currentQuestions.forEach((q, i) => { if(userAnswers[i] === q[5]) score++; });
            const area = document.getElementById('displayArea');
            area.innerHTML = `
                <div class="bg-indigo-950 text-white p-16 rounded-[3rem] text-center shadow-2xl mb-12 relative overflow-hidden">
                    <div class="relative z-10">
                        <p class="text-indigo-400 font-black uppercase tracking-[0.3em] mb-4">Your Performance</p>
                        <h2 class="text-9xl font-black mb-4">${score} <span class="text-4xl opacity-40">/ ${currentQuestions.length}</span></h2>
                        <button onclick="window.location.reload()" class="mt-10 bg-white text-indigo-950 px-12 py-4 rounded-2xl font-black hover:scale-105 transition-transform">TRY ANOTHER UNIT</button>
                    </div>
                </div>
            `;
            currentQuestions.forEach((q, i) => {
                const isCorrect = userAnswers[i] === q[5];
                area.innerHTML += `
                <div class="bg-white p-6 rounded-2xl border-l-8 ${isCorrect ? 'border-emerald-500' : 'border-rose-500'} mb-4 card-shadow">
                    <p class="font-bold text-slate-800 mb-2">${i+1}. ${q[0]}</p>
                    <div class="text-xs font-bold uppercase tracking-widest ${isCorrect ? 'text-emerald-600' : 'text-rose-600'}">
                        ${isCorrect ? '✓ Correct Answer' : '✗ Wrong - Correct: ' + q[5]}
                    </div>
                </div>`;
            });
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
