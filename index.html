<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNPSC Master Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900">

    <nav class="bg-indigo-900 text-white p-4 shadow-2xl sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white p-2 rounded-lg"><i class="fas fa-university text-indigo-900 text-xl"></i></div>
                <h1 class="text-xl font-extrabold tracking-tight">TNPSC MASTER <span class="text-indigo-400">DASHBOARD</span></h1>
            </div>
            <div id="statusIndicator" class="hidden md:block text-xs font-bold bg-indigo-800 px-4 py-2 rounded-full border border-indigo-700">
                <i class="fas fa-circle text-emerald-400 mr-2 animate-pulse"></i> SYSTEM ONLINE
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 md:p-8 max-w-6xl">
        <div class="glass rounded-3xl shadow-xl p-8 mb-10 border border-white">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div>
                    <label class="block text-xs font-black uppercase tracking-widest text-slate-500 mb-3">1. Select Standard</label>
                    <select id="stdSelect" onchange="updateSubjects()" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 outline-none transition-all font-semibold italic">
                        <option value="">Loading Folders...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-black uppercase tracking-widest text-slate-500 mb-3">2. Select Subject</label>
                    <select id="subjectSelect" onchange="updateUnits()" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 outline-none transition-all font-semibold">
                        <option value="">-- Choose Standard --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-black uppercase tracking-widest text-slate-500 mb-3">3. Select Unit (CSV)</label>
                    <select id="unitSelect" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 outline-none transition-all font-semibold">
                        <option value="">-- Choose Subject --</option>
                    </select>
                </div>
            </div>

            <div class="flex flex-col md:flex-row gap-5 mt-10">
                <button onclick="loadAction('notes')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-5 rounded-2xl font-black text-lg shadow-lg transition-all transform active:scale-95 flex items-center justify-center">
                    <i class="fas fa-book-open mr-3"></i> REVISION NOTES
                </button>
                <button onclick="openTestModal()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-5 rounded-2xl font-black text-lg shadow-lg transition-all transform active:scale-95 flex items-center justify-center">
                    <i class="fas fa-stopwatch mr-3"></i> START MOCK TEST
                </button>
            </div>
        </div>

        <div id="displayArea" class="pb-20">
            <div class="text-center py-20 opacity-30">
                <i class="fas fa-folder-open text-8xl mb-4"></i>
                <p class="text-xl font-bold italic">Select a unit to begin</p>
            </div>
        </div>
    </main>

    <div id="testModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md hidden z-[100] items-center justify-center p-6">
        <div class="bg-white rounded-[2rem] p-10 max-w-sm w-full shadow-2xl">
            <div class="text-center">
                <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl"><i class="fas fa-sliders-h"></i></div>
                <h3 class="text-2xl font-black mb-2 text-slate-800">Test Config</h3>
                <input type="number" id="qCount" value="25" class="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-2xl mb-8 text-center text-3xl font-black text-indigo-600 focus:border-indigo-500 outline-none">
                <div class="flex gap-4">
                    <button onclick="loadAction('test')" class="flex-[2] bg-indigo-600 text-white py-5 rounded-2xl font-black hover:bg-indigo-700 shadow-xl">START NOW</button>
                    <button onclick="closeModal()" class="flex-1 bg-slate-100 text-slate-500 py-5 rounded-2xl font-bold hover:bg-slate-200">EXIT</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_USER = 'as-imgn2kion';
        const REPO_NAME = 'TNPSC';
        const BASE_PATH = 'CSV_FILES';

        let currentQuestions = [];
        let userAnswers = [];

        async function initDashboard() {
            const stdSelect = document.getElementById('stdSelect');
            try {
                const folders = await fetchGitHubContent(BASE_PATH);
                stdSelect.innerHTML = '<option value="">-- Select Standard --</option>';
                folders.forEach(f => {
                    if(f.type === 'dir') {
                        const opt = document.createElement('option');
                        opt.value = f.name;
                        opt.textContent = f.name;
                        stdSelect.appendChild(opt);
                    }
                });
            } catch (e) { stdSelect.innerHTML = '<option>Error loading folders</option>'; }
        }

        async function updateSubjects() {
            const std = document.getElementById('stdSelect').value;
            const subSelect = document.getElementById('subjectSelect');
            if(!std) return;
            subSelect.innerHTML = '<option>Scanning...</option>';
            try {
                const folders = await fetchGitHubContent(`${BASE_PATH}/${std}`);
                subSelect.innerHTML = '<option value="">-- Select Subject --</option>';
                folders.forEach(f => {
                    if(f.type === 'dir') {
                        const opt = document.createElement('option');
                        opt.value = f.name;
                        opt.textContent = f.name;
                        subSelect.appendChild(opt);
                    }
                });
            } catch (e) { subSelect.innerHTML = '<option>No subjects found</option>'; }
        }

        async function updateUnits() {
            const std = document.getElementById('stdSelect').value;
            const sub = document.getElementById('subjectSelect').value;
            const unitSelect = document.getElementById('unitSelect');
            if(!sub) return;
            unitSelect.innerHTML = '<option>Scanning CSVs...</option>';
            try {
                const files = await fetchGitHubContent(`${BASE_PATH}/${std}/${sub}`);
                unitSelect.innerHTML = '<option value="">-- Select Unit --</option>';
                files.forEach(f => {
                    if(f.name.endsWith('.csv')) {
                        const opt = document.createElement('option');
                        opt.value = f.name;
                        opt.textContent = f.name.replace('.csv', '');
                        unitSelect.appendChild(opt);
                    }
                });
            } catch (e) { unitSelect.innerHTML = '<option>No units found</option>'; }
        }

        async function fetchGitHubContent(path) {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${encodeURIComponent(path)}`);
            return await res.json();
        }

        async function loadAction(mode) {
            const std = document.getElementById('stdSelect').value;
            const sub = document.getElementById('subjectSelect').value;
            const file = document.getElementById('unitSelect').value;
            if(!file) return alert("Select Unit First!");

            // FIX: Use encodeURIComponent for filenames with spaces/questions
            const safePath = `${BASE_PATH}/${std}/${sub}/${file}`.split('/').map(encodeURIComponent).join('/');
            const url = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/main/${safePath}`;
            
            try {
                const res = await fetch(url);
                if(!res.ok) throw new Error("File not found");
                const text = await res.text();
                
                // Parse CSV properly
                currentQuestions = text.trim().split('\n')
                    .filter(l => l.length > 5)
                    .map(l => {
                        // Handles commas inside quotes if any
                        return l.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g).map(i => i.replace(/"/g, '').trim());
                    });

                if(mode === 'notes') renderNotes();
                else { closeModal(); startMockTest(); }
            } catch (e) { 
                alert("ERROR: The file could not be found at: " + url); 
            }
        }

        function renderNotes() {
            const area = document.getElementById('displayArea');
            let html = `<div class="flex justify-between items-center mb-8"><h2 class="text-3xl font-black text-slate-800 uppercase">Revision Notes</h2><span class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded-full font-bold">${currentQuestions.length} Items</span></div>`;
            currentQuestions.forEach((q, idx) => {
                html += `<div class="bg-white p-8 rounded-3xl shadow-sm mb-6 border-l-[12px] border-emerald-500">
                    <p class="text-xl font-bold text-slate-800 mb-6">${idx+1}. ${q[0]}</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${[1,2,3,4].map(i => `<div class="p-4 rounded-2xl border-2 ${q[5] === q[i] ? 'bg-emerald-50 border-emerald-500 text-emerald-700 font-black' : 'bg-slate-50 border-slate-100 text-slate-400'}">${q[i] || 'N/A'}</div>`).join('')}
                    </div>
                </div>`;
            });
            area.innerHTML = html;
        }

        function startMockTest() {
            const count = parseInt(document.getElementById('qCount').value) || 10;
            let questionsToUse = [...currentQuestions].sort(() => 0.5 - Math.random()).slice(0, count);
            userAnswers = new Array(questionsToUse.length).fill(null);
            
            const area = document.getElementById('displayArea');
            let html = `<h2 class="text-3xl font-black text-slate-800 mb-8 uppercase">Mock Assessment</h2>`;
            questionsToUse.forEach((q, qIdx) => {
                html += `<div class="bg-white p-10 rounded-[2.5rem] shadow-xl mb-8 border border-slate-100">
                    <p class="text-2xl font-black text-slate-800 mb-8 leading-tight">${qIdx+1}. ${q[0]}</p>
                    <div class="grid grid-cols-1 gap-4">
                        ${[1,2,3,4].map(i => `
                            <label class="flex items-center p-6 border-2 border-slate-100 rounded-2xl cursor-pointer hover:bg-indigo-50 hover:border-indigo-500 transition-all group">
                                <input type="radio" name="q${qIdx}" value="${q[i]}" onchange="userAnswers[${qIdx}] = this.value" class="w-6 h-6 accent-indigo-600">
                                <span class="ml-5 text-lg font-semibold text-slate-600 group-hover:text-indigo-900">${q[i] || 'Option'}</span>
                            </label>`).join('')}
                    </div>
                </div>`;
            });
            html += `<button onclick="submitTest()" class="w-full bg-indigo-600 text-white py-6 rounded-3xl font-black text-2xl shadow-2xl hover:bg-indigo-700 transition-all transform active:scale-95 mb-20 uppercase tracking-widest">Submit Assessment</button>`;
            area.innerHTML = html;
            window.scrollTo({top: 0, behavior: 'smooth'});
            // Temporarily store the questions used for this test session
            currentQuestions = questionsToUse;
        }

        function submitTest() {
            let score = 0;
            currentQuestions.forEach((q, i) => { if(userAnswers[i] === q[5]) score++; });
            const area = document.getElementById('displayArea');
            let html = `<div class="bg-indigo-900 rounded-[3rem] p-16 text-center text-white mb-10 shadow-2xl">
                <h2 class="text-2xl font-bold opacity-60 mb-4 uppercase tracking-tighter">Your Score</h2>
                <div class="text-9xl font-black mb-4">${score}<span class="text-4xl opacity-30 ml-2">/ ${currentQuestions.length}</span></div>
                <button onclick="window.location.reload()" class="mt-8 bg-white/10 hover:bg-white/20 px-10 py-4 rounded-2xl font-bold transition-all border border-white/20 uppercase tracking-widest">New Test</button>
            </div>`;
            currentQuestions.forEach((q, i) => {
                const isCorrect = userAnswers[i] === q[5];
                html += `<div class="bg-white p-8 rounded-3xl border-l-[16px] ${isCorrect ? 'border-emerald-500' : 'border-rose-500'} mb-6 shadow-sm">
                    <p class="font-black text-xl text-slate-800 mb-4">${i+1}. ${q[0]}</p>
                    <div class="flex gap-4">
                        <div class="px-4 py-2 rounded-lg font-bold ${isCorrect ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'} uppercase text-xs">Your: ${userAnswers[i] || 'Blank'}</div>
                        ${!isCorrect ? `<div class="px-4 py-2 rounded-lg font-bold bg-emerald-100 text-emerald-700 uppercase text-xs">Correct: ${q[5]}</div>` : ''}
                    </div>
                </div>`;
            });
            area.innerHTML = html;
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function openTestModal() { document.getElementById('testModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('testModal').style.display = 'none'; }
        window.onload = initDashboard;
    </script>
</body>
</html>
