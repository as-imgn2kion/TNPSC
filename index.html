<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNPSC Mock Assessments</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap');
        
        body { 
            font-family: 'Roboto', sans-serif; 
            background-color: #f8f9fa; 
            color: #202124; 
        }

        h1, h2, h3, .google-font { font-family: 'Google Sans', sans-serif; }

        .google-card {
            background: white;
            border: 1px solid #dadce0;
            border-radius: 8px;
        }

        .nav-shadow { box-shadow: 0 1px 2px 0 rgba(60,64,67,.30), 0 2px 6px 2px rgba(60,64,67,.15); }

        /* Custom Select UI */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }

        /* Results Grid */
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 1rem; }
        @media (max-width: 768px) { .results-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50 py-3 px-6">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <h1 class="text-xl font-medium tracking-tight text-gray-700">TNPSC Mock Assessments</h1>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Platform by</p>
                <p class="text-sm font-bold text-blue-600 google-font">AATHISUDHAN A</p>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 md:p-8 max-w-6xl">
        
        <div class="bg-white rounded-xl border border-gray-200 p-6 mb-8 shadow-sm">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="relative">
                    <label class="text-xs font-medium text-gray-500 mb-2 block ml-1">Standard</label>
                    <select id="stdSelect" onchange="updateSubjects()" class="w-full pl-4 pr-10 py-3 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"></select>
                </div>
                <div class="relative">
                    <label class="text-xs font-medium text-gray-500 mb-2 block ml-1">Subject</label>
                    <select id="subjectSelect" onchange="updateUnits()" class="w-full pl-4 pr-10 py-3 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        <option>-- Select Subject --</option>
                    </select>
                </div>
                <div class="relative">
                    <label class="text-xs font-medium text-gray-500 mb-2 block ml-1">Unit</label>
                    <select id="unitSelect" class="w-full pl-4 pr-10 py-3 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        <option>-- Select Unit --</option>
                    </select>
                </div>
            </div>

            <div class="flex flex-col md:flex-row gap-4 mt-8">
                <button onclick="loadAction('notes')" class="flex-1 bg-white border border-gray-300 text-gray-700 py-3 rounded-lg font-medium text-sm hover:bg-gray-50 transition-all flex items-center justify-center">
                    STUDY NOTES
                </button>
                <button onclick="openConfig()" class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-medium text-sm hover:bg-blue-700 shadow-md transition-all flex items-center justify-center">
                    <i class="fas fa-play mr-2"></i> TAKE ASSESSMENT
                </button>
            </div>
        </div>

        <div id="displayArea"></div>
    </main>

    <div id="configModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden z-[60] items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full shadow-2xl border border-gray-200">
            <h3 class="text-lg font-bold google-font mb-2">Assessment Settings</h3>
            <p class="text-gray-500 text-xs mb-6">Enter the number of questions for this session.</p>
            <input type="number" id="qLimit" value="20" class="w-full p-4 bg-gray-100 rounded-xl text-center text-3xl font-bold text-blue-600 outline-none border-2 border-transparent focus:border-blue-500 mb-6">
            <div class="flex gap-3">
                <button onclick="loadAction('test')" class="flex-[2] bg-blue-600 text-white py-3 rounded-lg font-bold text-xs uppercase tracking-widest">Start Test</button>
                <button onclick="closeConfig()" class="flex-1 bg-gray-100 text-gray-500 py-3 rounded-lg font-bold text-xs uppercase tracking-widest">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_USER = 'as-imgn2kion';
        const REPO_NAME = 'TNPSC';
        const BASE_PATH = 'CSV_FILES';

        let masterData = [];
        let sessionQuestions = [];
        let userAnswers = [];

        const shuffle = (arr) => arr.sort(() => Math.random() - 0.5);

        async function fetchGH(path) {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${path}`);
            return await res.json();
        }

        async function initDashboard() {
            const folders = await fetchGH(BASE_PATH);
            const stdSelect = document.getElementById('stdSelect');
            stdSelect.innerHTML = '<option value="">-- Select Standard --</option>';
            folders.forEach(f => { if(f.type === 'dir') stdSelect.innerHTML += `<option value="${f.name}">${f.name}</option>`; });
        }

        async function updateSubjects() {
            const std = document.getElementById('stdSelect').value;
            const folders = await fetchGH(`${BASE_PATH}/${std}`);
            const subSelect = document.getElementById('subjectSelect');
            subSelect.innerHTML = '<option value="">-- Select Subject --</option>';
            folders.forEach(f => { if(f.type === 'dir') subSelect.innerHTML += `<option value="${f.name}">${f.name}</option>`; });
        }

        async function updateUnits() {
            const std = document.getElementById('stdSelect').value;
            const sub = document.getElementById('subjectSelect').value;
            const files = await fetchGH(`${BASE_PATH}/${std}/${sub}`);
            const unitSelect = document.getElementById('unitSelect');
            unitSelect.innerHTML = '<option value="">-- Select Unit --</option>';
            files.forEach(f => { if(f.name.endsWith('.csv')) unitSelect.innerHTML += `<option value="${f.name}">${f.name.replace('.csv','')}</option>`; });
        }

        function openConfig() { document.getElementById('configModal').classList.replace('hidden', 'flex'); }
        function closeConfig() { document.getElementById('configModal').classList.replace('flex', 'hidden'); }

        async function loadAction(mode) {
            const std = document.getElementById('stdSelect').value;
            const sub = document.getElementById('subjectSelect').value;
            const file = document.getElementById('unitSelect').value;
            if(!file) return alert("Please select all fields!");

            closeConfig();
            const url = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/main/${BASE_PATH}/${std}/${sub}/${encodeURIComponent(file)}`;
            
            try {
                const res = await fetch(url);
                const text = await res.text();
                const lines = text.trim().split('\n');
                
                masterData = lines.slice(1).map(line => {
                    const row = line.match(/(".*?"|[^",\n\r]+)(?=\s*,|\s*$)/g) || [];
                    return row.map(cell => cell.replace(/"/g, '').trim());
                }).filter(r => r.length >= 6);

                mode === 'notes' ? renderNotes() : startTest();
            } catch (e) { alert("Error fetching data."); }
        }

        function renderNotes() {
            const area = document.getElementById('displayArea');
            let html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
            masterData.forEach((q, i) => {
                html += `
                <div class="google-card p-5">
                    <p class="text-[11px] font-bold text-blue-500 uppercase mb-1 tracking-wider">Question ${i+1}</p>
                    <p class="text-[14px] font-medium text-gray-800 leading-relaxed mb-4">${q[0]}</p>
                    <div class="bg-green-50 border border-green-100 text-green-700 p-3 rounded-lg text-xs font-bold inline-flex items-center w-full">
                        <i class="fas fa-check-circle mr-2 opacity-50"></i> ${q[5]}
                    </div>
                </div>`;
            });
            html += `</div>`;
            area.innerHTML = html;
        }

        function startTest() {
            const limit = parseInt(document.getElementById('qLimit').value) || masterData.length;
            sessionQuestions = shuffle([...masterData]).slice(0, limit).map(q => {
                let options = shuffle([ {txt: q[1]}, {txt: q[2]}, {txt: q[3]}, {txt: q[4]} ]);
                return { question: q[0], options: options, correct: q[5] };
            });

            userAnswers = new Array(sessionQuestions.length).fill(null);
            const area = document.getElementById('displayArea');
            let html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">`;
            
            sessionQuestions.forEach((q, qIdx) => {
                html += `
                <div class="google-card p-6 flex flex-col">
                    <p class="text-[11px] font-bold text-gray-400 mb-3 tracking-widest uppercase">Question ${qIdx+1}</p>
                    <p class="font-medium text-[15px] leading-relaxed mb-6 text-gray-800">${q.question}</p>
                    <div class="space-y-2 mt-auto">
                        ${q.options.map(opt => `
                            <label class="flex items-center p-3 border border-gray-100 rounded-lg cursor-pointer hover:bg-blue-50 hover:border-blue-100 transition-all group">
                                <input type="radio" name="q${qIdx}" value="${opt.txt}" onchange="userAnswers[${qIdx}] = this.value" class="w-4 h-4 accent-blue-600">
                                <span class="ml-3 text-sm text-gray-600 group-hover:text-blue-700">${opt.txt}</span>
                            </label>`).join('')}
                    </div>
                </div>`;
            });
            html += `</div>
            <div class="max-w-xs mx-auto mt-12 pb-20">
                <button onclick="submitTest()" class="w-full bg-gray-900 text-white py-4 rounded-xl font-bold text-xs uppercase tracking-widest shadow-xl hover:bg-black transition-all">Submit Final Review</button>
            </div>`;
            area.innerHTML = html;
            window.scrollTo(0,0);
        }

        function submitTest() {
            let score = 0;
            sessionQuestions.forEach((q, i) => { if(userAnswers[i] === q.correct) score++; });
            const area = document.getElementById('displayArea');
            area.innerHTML = `
                <div class="bg-white border border-gray-200 p-12 rounded-2xl text-center mb-8 shadow-sm">
                    <p class="text-xs font-bold uppercase tracking-[0.3em] text-gray-400 mb-2">Assessment Results</p>
                    <h2 class="text-7xl font-bold text-gray-800 google-font mb-6">${score} <span class="text-2xl text-gray-300">/ ${sessionQuestions.length}</span></h2>
                    <button onclick="window.location.reload()" class="bg-blue-600 text-white px-10 py-3 rounded-lg font-bold text-xs uppercase tracking-widest hover:bg-blue-700 transition-all">Return to Dashboard</button>
                </div>
                <div class="results-grid pb-20">
                    ${sessionQuestions.map((q, i) => {
                        const isCorrect = userAnswers[i] === q.correct;
                        const selected = userAnswers[i] || "NO ANSWER SELECTED";
                        return `
                        <div class="google-card p-5 border-l-4 ${isCorrect ? 'border-l-green-500' : 'border-l-red-500'}">
                            <p class="text-[13px] font-medium text-gray-800 mb-4">${i+1}. ${q.question}</p>
                            <div class="space-y-2">
                                <div class="flex items-center text-xs font-bold ${isCorrect ? 'text-green-600' : 'text-red-600'}">
                                    <i class="fas ${isCorrect ? 'fa-check' : 'fa-times'} mr-2"></i>
                                    YOUR ANSWER: ${selected}
                                </div>
                                ${!isCorrect ? `
                                <div class="flex items-center text-xs font-bold text-blue-600 bg-blue-50 p-2 rounded">
                                    <i class="fas fa-info-circle mr-2"></i>
                                    CORRECT ANSWER: ${q.correct}
                                </div>` : ''}
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            `;
            window.scrollTo(0,0);
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
